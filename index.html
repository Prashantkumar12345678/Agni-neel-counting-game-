<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- The artwork is the design's, and must reach the child as drawn. Chrome's
       auto-dark-mode and the high-contrast modes recolour images by heuristic —
       which is what turned some of the orange candies green, and only some of
       them, since the heuristic is per image. Declaring the page light opts it
       out. -->
  <meta name="color-scheme" content="only light" />
  <title>Agni & Nil — Counting Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Itim&family=Londrina+Solid&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="viewport">
    <!-- Fixed 1920 x 1080 design stage (Figma 190:495), uniformly scaled to fit.
         Layer order below mirrors the Figma z-order of the frame. -->
    <main class="stage" id="stage" aria-label="Counting game — screen 1">

      <!-- The camera. Everything in the scene lives in here so it can be
           panned as one; the stage around it stays put and keeps clipping. -->
      <!-- The room. Outside the camera, because the camera moves across the
           table rather than taking the table with it. -->
      <img class="bg" src="Assets/background.png" alt="" aria-hidden="true" />

      <div class="world" id="world">

        <!-- Loose treats: blueberries scattered on the table (190:538 … 190:553) -->
        <div class="treats" id="treats"></div>

        <!-- Jar: holds the answer display + keypad (190:506), and stands on
             the floor like everything else -->
        <span class="jar-shade" aria-hidden="true"></span>
        <img class="jar" src="Assets/Jar.png" alt="" aria-hidden="true" />

        <!-- Instruction panel (190:507). The plate opens after Agni lands, then
             the copy types itself out. -->
        <div class="panel">
          <!-- The plate: the panel asset from its own plate edge rightward -->
          <!-- Closed and hidden in the markup, so the frame behind the start
               gate is an empty room: playIntro() sets these itself, but it does
               not run until the tap, and until then the plate and the standing
               dragon were sitting there giving the entrance away. -->
          <div class="panel__plate panel__plate--closed" id="panelPlate">
            <img src="Assets/Intrustiction panel.svg" alt="" />
          </div>
          <!-- Standing Agni: the same asset, cropped to the dragon and the
               hand he rests on the plate -->
          <div class="agni-stand agni-stand--waiting" id="agniStand">
            <img src="Assets/Intrustiction panel.svg" alt="Agni the dragon" />
          </div>
          <p class="panel__text" id="panelText">
            <span class="panel__typed" id="panelTyped"></span><span class="panel__caret" id="panelCaret" aria-hidden="true"></span>
          </p>
        </div>

        <!-- Agni's flight — swapped for the standing still once he lands -->
        <img class="agni" id="agni" src="Assets/agni fly gif.gif" alt="" aria-hidden="true" />

        <!-- Carved wooden cap — drops on once every treat is in the jar -->
        <img class="jar-lid" id="jarLid" src="Assets/Jar cap.png" alt="" aria-hidden="true" />

        <!-- Sparkle on the closed jar, per the script's correct-feedback row -->
        <div class="sparkles" id="sparkles" aria-hidden="true"></div>

        <!-- Answer panel (190:516). Waits centred in the jar; tapping it lifts
             the panel to its design spot and opens the pad underneath. -->
        <!-- A full-stage layer around the plate, so the fold's reveal can be
             clipped in stage coordinates. `clip-path` is relative to the
             element's own box, and the plate is a 324 x 121 box in the jar —
             the path meant for the whole page landed nowhere near it. -->
        <div class="answer-layer">
        <div class="answer" id="answer">
          <div class="display" aria-hidden="true">
            <img src="Assets/answer box 2.png" alt="" />
          </div>
          <output class="display__value" id="displayValue" aria-live="polite" aria-label="Your answer"></output>
          <button class="display__hit" id="displayHit" type="button" aria-label="Open the number pad"></button>
        </div>
        </div>

        <!-- Hand nudge: guides the child through the activity. `hand.webp` is
             312 x 446 with its fingertip at the very top, 36.7% across — that
             point is the anchor, so --hand-x/-y are the thing being pointed at. -->
        <div class="hand" id="hand" aria-hidden="true">
          <span class="hand__ripple"></span>
          <img class="hand__art" src="Assets/hand.webp" alt="" />
        </div>

        <!-- The pad, finished: twelve plates with their digits, the red X and
             the green tick all drawn in. The keys below are transparent hit
             areas measured off this picture. -->
        <!-- Shut in the markup, not just once the first stage starts: the pad
             used to sit there in full view through Agni's whole entrance,
             because that is when shutKeypad() first runs. -->
        <div class="keypad keypad--closed" aria-hidden="true">
          <img src="Assets/keypad 2.png" alt="" />
        </div>
        <div class="keys is-locked keys--closed" id="keys" role="group"
             aria-label="Number keypad"></div>

        <!-- A browser will not play a sound before the page has been touched:
             every cue in the intro came back NotAllowedError, Agni's wingbeats
             included. So the intro waits for one tap, which is also what lets
             his voice speak. -->
        <!-- The play button hands over to Agni: he crosses from the top-left
             corner to the bottom-right, and the room is revealed behind him.
             Outside .world, so the camera never carries it. -->
        <div class="cross" id="cross" aria-hidden="true">
          <span class="cross__flap"></span>
          <img class="cross__agni" src="Assets/agni fly gif.gif" alt="" />
        </div>

        <button class="begin" id="begin" type="button">
          <span class="begin__pill">Tap to play</span>
        </button>

      </div>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
